bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: BASE_LINK
    odom_topic: /odom
    thread_count: 8
    default_nav_to_pose_bt_xml: "$(find-pkg-share navigation)/param/auto_nav.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share navigation)/param/auto_nav.xml"
    bt_loop_duration: 100
    default_server_timeout: 1000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - custom_planner_bt


bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 999.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.0
      movement_time_allowance: 999999.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.087

    FollowPath:
      plugin: "nav2_custom_plugins/MPPIGPUController"

      # 归一化代价: total = cost_scale × (obstacle_ratio·obs + tracking_ratio·trk + speed_ratio·spd) / horizon
      cost_scale: 30.0
      obstacle_ratio: 0.10
      tracking_ratio: 0.30
      speed_ratio: 0.60
      # 独立偏离路径代价 (软墙)
      path_deviation_weight: 0.0
      path_corridor: 0.15

      num_samples: 8000
      prediction_horizon: 6
      dt: 0.1
      max_v: 0.40
      min_v: -0.40   # 与 max_v 对称
      max_vy: 0.20
      max_w: 0.60

      action_std_v: 0.5
      action_std_vy: 0.5
      action_std_w: 0.4
      nln_ratio: 0.35
      nln_sigma_mult: 2.0
      noise_decay_rate: 0.55
      noise_scale_floor_vx: 0.35
      noise_scale_floor_vy: 0.30
      noise_scale_floor_w: 0.30
      cross_track_noise_scale: 1.5

      guidance_weight: 0.4            # 路径引导混合 (0=纯噪声, 1=纯引导), 降低留空间给代价
      turn_lateral_boost: 2.0
      lateral_guidance_scale: 0.7     # vx/vy采样向lookahead方向混合比例

      spatial_decay_weight: 0.3       # 空间进度权重 (vs 时间进度)
      exploration_decay_start: 2.0    # 探索范围开始衰减距离 (m)
      exploration_decay_end: 0.3      # 探索范围衰减结束距离 (m)
      exploration_decay_floor: 0.3    # 探索范围衰减下限

      lambda: 0.05

      footprint_front: 0.17
      footprint_back: 0.17
      footprint_left: 0.28
      footprint_right: 0.28
      footprint_sample_spacing: 0.04
      rear_obstacle_cost: 0.0

      min_lookahead_dist: 0.4
      lookahead_kp: 1.0

      terminal_angle_dist: 0.08
      terminal_angle_kp: 1.5
      terminal_angle_tolerance: 0.07

      global_trajectory_ratio: 0.3
      global_horizon: 50

      pure_rotation_ratio: 0.10
      pure_rotation_steps: 2
      enable_lateral_bias: false
      enable_heading_speed_limit: true
      heading_misalign_threshold: 1.047
      enable_narrow_passage: false
      enable_ema: false
      ema_alpha: 0.1




controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: BASE_LINK
      use_sim_time: True
      rolling_window: True
      track_unknown_space: False
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[ [0.20, 0.30], [0.20, -0.30], [-0.20, -0.30], [-0.20, 0.30] ]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]

      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 5.0
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: point_zedxm
        max_obstacle_height: 0.8
        min_obstacle_height: 0.1
        point_zedxm:
          topic: /chest_camera/points_sparse
          expected_update_rate: 1.0
          max_obstacle_height: 0.8
          min_obstacle_height: -0.1
          observation_persistence: 0.0
          clearing: True
          marking: True
          raytrace_max_range: 2.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.1
          data_type: "PointCloud2"

      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: BASE_LINK
      use_sim_time: True
      update_frequency: 1.0
      transform_tolerance: 1.0
      publish_frequency: 2.0
      footprint: "[ [0.20, 0.30], [0.20, -0.30], [-0.20, -0.30], [-0.20, 0.30] ]"
      rolling_window: False
      track_unknown_space: True
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        map_topic: "/map"
        subscribe_to_updates: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 1.5


planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: false

      enable_se2_optimization: true
      se2_resample_resolution: 0.10
      robot_length: 0.4
      robot_width: 0.6
      robot_safe_distance: 0.10
      se2_iterations: 60
      se2_learning_rate: 0.02
      se2_fd_eps: 0.02
      se2_w_obs: 300.0
      se2_w_ref: 0.3
      se2_w_smooth: 20.0
      se2_w_yaw_smooth: 8.0
      se2_w_align: 0.4
      se2_w_step: 2.0
      se2_max_step: 0.20
      se2_max_yaw_delta: 0.30
      se2_w_tangent: 5.0
      se2_max_optimization_points: 100
      se2_post_smooth_passes: 2
      se2_post_smooth_alpha: 0.35

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True


robot_state_publisher:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true 
    
    max_velocity: [0.35, 0.05, 0.5]
    min_velocity: [-0.35, -0.05, -0.5]   # 与 max_velocity 对称
    
    max_accel: [1.0, 1.0, 1.0]
    
    max_decel: [-2.5, -1.0, -1.0] 
    
    deadband_velocity: [0.01, 0.0, 0.01]
    
    feedback: OPEN_LOOP
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""
    topic_name: "/map"
    frame_id: "odom"
