bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 999.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.0
      movement_time_allowance: 999999.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.17

    FollowPath:
      plugin: "nav2_custom_plugins_v2/MPPISteeringController"

      # ── 控制空间 ──
      num_samples: 8000
      prediction_horizon: 5
      dt: 0.1
      max_v: 0.40
      min_v: -0.40
      max_vy: 0.20
      max_w: 10.0

      # ── 代价 ──
      cost_scale: 50.0
      obstacle_ratio: 0.50
      tracking_ratio: 0.40
      speed_ratio: 0.15
      lambda: 0.05

      # ── 噪声 ──
      action_std_v: 0.2
      action_std_vy: 0.1
      action_std_w: 0.4

      # ── 碰撞 ──
      footprint_front: 0.17
      footprint_back: 0.17
      footprint_left: 0.28
      footprint_right: 0.28

      # ── 子类权重 ──
      footprint_weight: 1.0
      path_align_weight: 1.0
      path_angle_weight: 2.0
      path_deviation_weight: 0.3
      speed_reward_weight: 1.0
      base_similarity_weight: 0.5     # warm-start 一致性约束

      # ── 前瞻 ──
      min_lookahead_dist: 0.3
      lookahead_kp: 0.1               # 前瞻减速最低比例 (0=完全停止)
      lookahead_decel_dist: 0.5        # 开始减速距离 (m)
      lookahead_overshoot_weight: 5.0  # 越界惩罚系数

      # ── 终端朝向: 距终点此距离内直接发 goal_yaw ──
      terminal_angle_dist: 0.05
      terminal_angle_tolerance: 0.17

      # ── 路径 / 输出模式 ──
      use_planner_yaw: true           # true=planner朝向, false=自算切线
      use_global_mode: true           # true=odom系输出, false=base_link系

      # ── 状态机 ──
      enable_heading_speed_limit: true
      heading_misalign_threshold: 1.047
      enable_narrow_passage: false

      # ── EMA ──
      enable_ema: false
      ema_alpha: 0.1

      # ── 日志 ──
      enable_file_log: true
      log_file_path: "/tmp/mppi_steering_controller.log"




controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: BASE_LINK
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.20, 0.30], [0.20, -0.30], [-0.20, -0.30], [-0.20, 0.30]]"

      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /rtabmap/map
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True 
        
        # --- 控制体素网格的整体高度 ---
        origin_z: 0.0            
        z_resolution: 0.1        # Z轴分辨率 10cm
        z_voxels: 14             # 14层 * 0.1m = 1.4m 的总网格高度 (覆盖机器人的 1.2m 身高)
        
        # ★ 核心参数：决定哪些高度的障碍物会被投影到2D地图上
        max_obstacle_height: 1.7 # 忽略 1.3m 以上的障碍物，允许机器人从下方穿过
        
        # 未知区域处理（如果雷达扫不到上方，默认上方是安全的）
        unknown_threshold: 15
        mark_threshold: 0

        observation_sources: pointcloud_sensor
        pointcloud_sensor:
          topic: /chest_camera/points_sparse
          data_type: "PointCloud2"
          
          # ★ 核心参数：在数据源头过滤掉不需要关心的高空点云
          max_obstacle_height: 1.7 # 高于 1.3m 的雷达点云直接扔掉，节省 CPU 算力
          min_obstacle_height: 0.1 # 过滤掉 0.1m 以下的地面点云
          
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          clearing: True
          marking: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0    # 平缓衰减 → 通道内形成平滑梯度引导走中间
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: BASE_LINK
      use_sim_time: true
      footprint: "[[0.20, 0.30], [0.20, -0.30], [-0.20, -0.30], [-0.20, 0.30]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /rtabmap/map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.20


planner_server:
  ros__parameters:
    use_sim_time: True
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: false

      enable_se2_optimization: true
      se2_resample_resolution: 0.10
      robot_length: 0.4
      robot_width: 0.6
      robot_safe_distance: 0.10
      se2_iterations: 60
      se2_learning_rate: 0.02
      se2_fd_eps: 0.02
      se2_w_obs: 300.0
      se2_w_ref: 0.3
      se2_w_smooth: 20.0
      se2_w_yaw_smooth: 8.0
      se2_w_align: 0.4
      se2_w_step: 2.0
      se2_max_step: 0.20
      se2_max_yaw_delta: 0.30
      se2_w_tangent: 5.0
      se2_max_optimization_points: 100
      se2_post_smooth_passes: 2
      se2_post_smooth_alpha: 0.35

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True


robot_state_publisher:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true 
    
    max_velocity: [0.35, 0.05, 0.5]
    min_velocity: [-0.35, -0.05, -0.5]   # 与 max_velocity 对称
    
    max_accel: [1.0, 1.0, 1.0]
    
    max_decel: [-2.5, -1.0, -1.0] 
    
    deadband_velocity: [0.01, 0.0, 0.01]
    
    feedback: OPEN_LOOP
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""
    topic_name: "/map"
    frame_id: "odom"
