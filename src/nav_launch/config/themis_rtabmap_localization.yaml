# ============================================================
# RTAB-Map 定位/建图配置 — THEMIS (TH02-A7)
# RGB-D 模式, ORB 视觉特征
# ============================================================

/**:
  launch:
    subscribe_rgbd: "false"
    subscribe_depth: "true"
    rgb_topic: "/chest_camera/chest_camera/image_raw"
    camera_info_topic: "/chest_camera/chest_camera/camera_info"
    depth_topic: "/chest_camera/chest_camera/depth/image_raw"
    imu_topic: "/base_imu"
    odom_topic: "/odom"
    frame_id: "BASE_LINK"
    odom_frame_id: "odom"
    map_frame_id: "map"
    publish_tf: "true"

  rtabmap:
    ros__parameters:

      # ── 配准: Default (视觉优先 + ICP 回退) ──
      Reg/Strategy: "0"
      Reg/Force3DoF: "false"
      RGBD/NeighborLinkRefining: "true"
      RGBD/OptimizeMaxError: "0"

      # ── ICP 点云配准 (定位模式: 严格匹配防止误跳变) ──
      Icp/PointToPlane: "false"
      Icp/Iterations: 50
      Icp/MaxCorrespondenceDistance: 0.5
      Icp/CorrespondenceRatio: 0.3
      Icp/Epsilon: 0.001
      Icp/OutlierRatio: 0.5
      Icp/VoxelSize: 0.05
      Icp/DownsamplingStep: 1
      Icp/MaxTranslation: 0.5
      Icp/MaxRotation: 0.5

      # ── 2D 栅格地图 ──
      Grid/3D: "false"
      Grid/RayTracing: "true"
      Grid/RangeMax: 5.0
      Grid/RangeMin: 0.5
      Grid/MinGroundHeight: -1.3
      Grid/MaxGroundHeight: -1.05
      Grid/MaxObstacleHeight: 1.0
      Grid/CellSize: 0.05
      Grid/FromDepth: "true"

      # ── 视觉特征 (ORB) ──
      Vis/FeatureType: "6"
      Vis/MaxFeatures: 1000
      # 最少内点数 (重定位阶段需要一定数量的内点确保匹配可靠)
      Vis/MinInliers: 12
      # 重投影误差阈值 (像素) ← 修复: 0.1→3.0, 与 RTAB-Map 默认一致
      Vis/InlierDistance: 3.0
      # NNDR 比率 (收紧以减少误匹配, 提高 PnP 几何验证质量)
      Vis/CorNNDR: 0.7

      # ── 词袋 / 字典 (BoW Vocabulary) ──
      # FLANN 词汇表增量构建 (定位时从数据库加载已有词汇表)
      Kp/IncrementalFlann: "true"
      # 参与字典构建的特征数 (与 Vis/MaxFeatures 一致)
      Kp/MaxFeatures: "1000"
      # TF-IDF 加权回环检测
      Kp/TfIdfLikelihoodUsed: "true"
      # 坏视觉词比率阈值
      Kp/BadSignRatio: "0.3"
      # 增量字典更新
      Kp/IncrementalDictionary: "true"
      # 检测器策略: 6=ORB
      Kp/DetectorStrategy: "6"
      # 将 FLANN 索引保存到数据库 (定位时从 DB 加载, 无需重建)
      Kp/FlannIndexSaved: "true"

      # ── 闭环检测 / 定位 ──
      # STM 大小 (定位模式设为 0)
      Mem/STMSize: 0
      # 关闭空间邻近过滤 ← 允许全局重定位
      RGBD/ProximityBySpace: "false"
      # 禁用基于距离的定位拒绝 (0=不限制, 允许远距离重定位)
      RGBD/MaxLocalizationDistance: 0
      # 回环/重定位阈值 (与建图一致)
      Rtabmap/LoopThr: 0.11

      # ── 图优化 ──
      Optimizer/Strategy: "1"
      Optimizer/Iterations: 20
      Optimizer/GravitySigma: "0.3"

      # ── AprilTag ──
      RGBD/MarkerDetection: "true"
      Marker/Dictionary: "20"
      Marker/Length: "0.16"

      # ── QoS ──
      qos_image: 2
      qos_camera_info: 2
      qos_odom: 2
