planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False


robot_state_publisher:
  ros__parameters:
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true 
    
    max_velocity: [0.35, 0.05, 0.5]
    min_velocity: [-0.15, -0.05, -0.5]
    
    max_accel: [1.0, 1.0, 1.0]
    
    max_decel: [-2.5, -1.0, -1.0] 
    
    deadband_velocity: [0.01, 0.0, 0.01]
    
    feedback: OPEN_LOOP
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""
    topic_name: "/map"
    frame_id: "MAP"
