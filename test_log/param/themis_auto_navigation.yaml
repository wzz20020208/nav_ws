bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: MAP
    robot_base_frame: centroid
    odom_topic: /fused_odom
    thread_count: 8
    default_nav_to_pose_bt_xml: "$(find-pkg-share navigation)/param/auto_nav.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share navigation)/param/auto_nav.xml"
    bt_loop_duration: 100
    default_server_timeout: 1000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - custom_planner_bt
    - backup
    
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      path_length_tolerance: 1.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35

      min_lookahead_dist: 1.0
      max_lookahead_dist: 2.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0 
      
      use_regulated_linear_velocity_scaling: true 
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.1
      
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 0.5  
      
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5 
      rotate_to_heading_angular_vel: 0.4 
      
      max_angular_vel: 0.5
      max_angular_accel: 1.0
      
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      min_distance_to_obstacle: 0.1
      transform_tolerance: 0.1
      stateful: true



controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 1.0
      global_frame: MAP
      robot_base_frame: centroid
      use_sim_time: False
      rolling_window: True
      track_unknown_space: True
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[ [0.15, 0.25], [0.15, -0.25], [-0.15, -0.25], [-0.15, 0.25] ]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]

      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.10
        cost_scaling_factor: 8.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: point_zedxm
        max_obstacle_height: 0.8
        min_obstacle_height: -1.15
        point_zedxm:
          topic: /filtered_point_cloud
          expected_update_rate: 1.0
          max_obstacle_height: 0.8
          min_obstacle_height: -1.15
          observation_persistence: 0.0
          clearing: True
          marking: True
          raytrace_max_range: 2.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.1
          data_type: "PointCloud2"

      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: MAP
      robot_base_frame: centroid
      use_sim_time: False
      update_frequency: 1.0
      transform_tolerance: 1.0
      publish_frequency: 2.0
      footprint: "[ [0.15, 0.30], [0.15, -0.30], [-0.15, -0.30], [-0.15, 0.30] ]"
      rolling_window: False
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        map_topic: "/map"
        subscribe_to_updates: False

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: point_zedxm
        max_obstacle_height: 0.8
        min_obstacle_height: -1.15
        point_zedxm:
          topic: /filtered_point_cloud
          max_obstacle_height: 0.8
          min_obstacle_height: -1.15
          expected_update_rate: 1.0
          observation_persistence: 0.0
          clearing: True
          marking: True
          raytrace_max_range: 2.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.1
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 1.5


planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      lattice_filepath: "$(find-pkg-share navigation)/param/themis.json"
      
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0

      non_straight_penalty: 5.0 
      change_penalty: 2.0
      rotation_penalty: 5.0
      reverse_penalty: 40.0
      allow_reverse_expansion: false
      cost_penalty: 4.0

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0 
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      downsample_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      coarse_search_resolution: 1
      goal_heading_mode: "DEFAULT"
      cache_obstacle_heuristic: true
      
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.4           
        w_data: 0.2                   
        tolerance: 1.0e-10

